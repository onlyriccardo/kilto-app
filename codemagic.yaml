workflows:
  ios-release:
    name: Kilto iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.kilto.app" \
            --type IOS_APP_STORE \
            --create
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Import certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=https://kilto.app/api \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

  android-release:
    name: Kilto Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - kilto_signing     # CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        # - google_play     # re-enable once GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is set
      flutter: 3.27.4
    scripts:
      - name: Decode keystore and write key.properties
        script: |
          set -e
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/android/app/kilto-release.jks
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storeFile=$CM_BUILD_DIR/android/app/kilto-release.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          ls -la $CM_BUILD_DIR/android/app/kilto-release.jks $CM_BUILD_DIR/android/key.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release --dart-define=API_BASE_URL=https://kilto.app/api
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal      # change to "alpha" / "beta" / "production" once verified
    #     submit_as_draft: false
