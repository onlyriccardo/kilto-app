name: kilto
description: "Kilto — CRM mobile app. Client booking, staff management, vertical modules."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP & networking
  dio: ^5.7.0

  # Navigation
  go_router: ^14.8.1

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.4

  # SVG rendering (odontogram, body maps)
  flutter_svg: ^2.0.17

  # Image caching
  cached_network_image: ^3.4.1

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0

  # i18n / dates
  intl: ^0.19.0

  # Google sign-in
  google_sign_in: ^6.2.2

  # Url launcher (for links)
  url_launcher: ^6.3.1

  # Image picker (avatar upload)
  image_picker: ^1.1.2

  # QR scanning (join a clinic by scanning its invite code)
  mobile_scanner: ^5.2.3

  # Biometric unlock for the Kilto root session
  local_auth: ^2.3.0

  # Universal / deep-link handling (kilto://join/{code}, https://kilto.com/j/{code})
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/kilto-favicon.png"
  min_sdk_android: 21
  # Black background matches the K° rounded-square brand mark.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/brand/kilto-favicon.png"
  remove_alpha_ios: true

flutter_native_splash:
  # Black canvas with the K° mark centered — matches the modernized splash.
  color: "#000000"
  image: "assets/brand/kilto-favicon.png"
  android_12:
    color: "#000000"
    image: "assets/brand/kilto-favicon.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    # Outfit ships as a single variable font (wght axis 100..900).
    # Flutter picks the right axis position based on the requested FontWeight.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf

  assets:
    - assets/images/
    - assets/svg/
    - assets/brand/
